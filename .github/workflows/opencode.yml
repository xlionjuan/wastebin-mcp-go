name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ${{ github.event.comment.id }}

jobs:
  opencode:
    if: |
      contains(fromJSON('["xlionjuan"]'), github.event.comment.user.login) &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # So agent can see the history
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          install-only: true

      - name: Install just
        uses: taiki-e/install-action@682e7d9e49c5e653d371fc6adbda67653461378a # v2.82.4
        with:
          tool: just@1.51.0
          fallback: none

      - name: Install Go skills for OpenCode
        env:
          # renovate: datasource=git-refs packageName=https://github.com/samber/cc-skills-golang currentValue=main
          CC_SKILLS_GOLANG_SHA: 8b2d019212d6a5390d472a7660a8489109d7db49
        run: |
          mkdir -p "$HOME/.agents/skills"
          git init "$HOME/.agents/skills/cc-skills-golang"
          git -C "$HOME/.agents/skills/cc-skills-golang" remote add origin https://github.com/samber/cc-skills-golang.git
          git -C "$HOME/.agents/skills/cc-skills-golang" fetch --depth=1 origin "$CC_SKILLS_GOLANG_SHA"
          git -C "$HOME/.agents/skills/cc-skills-golang" checkout --detach "$CC_SKILLS_GOLANG_SHA"

      - name: Run opencode
        uses: xlionjuan/opencode-github-actions@6761907ac34484f8cc9934e0dacf324cafe29fe6 # main
        with:
          model: opencode-go/deepseek-v4-flash
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          OPENCODE_PERMISSION: '{"external_directory": {"~/**": "allow", "/tmp/**": "allow"}}'
