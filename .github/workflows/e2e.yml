name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-End
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install just
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: just@1.51.0
          fallback: none

      - name: Build binary
        run: just build

      - name: E2E tests
        env:
          E2E_MCP_BINARY: ./wastebin-mcp-go
          WASTEBIN_SERVER_URL: https://bin-staging.xlion.tw
        run: just test-e2e
